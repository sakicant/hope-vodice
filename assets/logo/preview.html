<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hope Apartments — logotip</title>
<style>
  :root { --sand:#FBF8F3; --deep:#0A2E45; --line:#E8E2D8; --ink:#12232E; --muted:#5A6B78; }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px; background:var(--sand); color:var(--ink);
         font:400 15px/1.5 system-ui, sans-serif; }
  h1 { font-size:19px; margin:0 0 4px; }
  p.lead { margin:0 0 28px; color:var(--muted); font-size:13.5px; }
  section { background:#fff; border:1px solid var(--line); border-radius:12px;
            padding:22px; margin-bottom:18px; }
  section.dark { background:var(--deep); border-color:#14425F; }
  h2 { font-size:11px; letter-spacing:2px; text-transform:uppercase;
       color:var(--muted); margin:0 0 16px; font-weight:600; }
  section.dark h2 { color:#9FB6C4; }
  .row { display:flex; align-items:flex-end; gap:32px; flex-wrap:wrap; }
  figure { margin:0; display:flex; flex-direction:column; align-items:center; gap:8px; }
  figcaption { font-size:10.5px; color:var(--muted); }
  section.dark figcaption { color:#9FB6C4; }
  img { display:block; }
</style>
</head>
<body>
<h1>Hope Apartments — logotip</h1>
<p class="lead">Radna verzija. Sva slova su krivulje, font nije potreban.</p>

<section>
  <h2>Okomiti logotip</h2>
  <div class="row">
    <figure><img src="logo-full.svg" width="340" alt="Okomiti logotip"><figcaption>340 px</figcaption></figure>
    <figure><img src="logo-full.svg" width="150" alt="Okomiti logotip, manji"><figcaption>150 px</figcaption></figure>
    <figure><img src="logo-full.svg" width="96" alt="Okomiti logotip, najmanji"><figcaption>96 px · granica</figcaption></figure>
  </div>
</section>

<section>
  <h2>Vodoravni logotip · zaglavlje</h2>
  <div class="row">
    <figure><img src="logo-horizontal.svg" width="260" alt="Vodoravni logotip"><figcaption>260 px</figcaption></figure>
    <figure><img src="logo-horizontal.svg" width="170" alt="Vodoravni logotip, manji"><figcaption>170 px</figcaption></figure>
    <figure><img src="logo-horizontal.svg" width="120" alt="Vodoravni logotip, najmanji"><figcaption>120 px · granica</figcaption></figure>
  </div>
</section>

<section>
  <h2>Oznaka i favicon</h2>
  <div class="row">
    <figure><img src="favicon.svg" width="96" alt="Favicon, veliki"><figcaption>96 px</figcaption></figure>
    <figure><img src="favicon.svg" width="48" alt="Favicon, srednji"><figcaption>48 px</figcaption></figure>
    <figure><img src="favicon.svg" width="32" alt="Favicon, 32 piksela"><figcaption>32 px</figcaption></figure>
    <figure><img src="favicon.svg" width="16" alt="Favicon, 16 piksela"><figcaption>16 px</figcaption></figure>
    <figure><img src="logo-e.svg" width="64" alt="Slovo E"><figcaption>slovo E</figcaption></figure>
  </div>
</section>

<section class="dark">
  <h2>Na tamnoj podlozi</h2>
  <div class="row">
    <figure><img src="logo-horizontal-white.svg" width="260" alt="Vodoravni logotip, bijeli"><figcaption>260 px</figcaption></figure>
    <figure><img src="logo-horizontal-white.svg" width="150" alt="Vodoravni logotip, bijeli, manji"><figcaption>150 px</figcaption></figure>
    <figure><img src="favicon.svg" width="48" alt="Favicon na tamnoj podlozi"><figcaption>favicon</figcaption></figure>
  </div>
</section>

</body>
</html>
